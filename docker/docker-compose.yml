version: '3.8'

services:
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: securemon-backend
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/securemon
      - JWT_SECRET=securemon-super-secret-jwt-key-sih-2026-ntro-mic-authorized-only
      - ZAP_ENABLED=true
      - ZAP_PROXY_URL=http://zap:8080
      - ZAP_API_KEY=securemon-zap-api-token-2026
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000
    depends_on:
      - postgres
      - zap
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      dockerfile: ../docker/Dockerfile.frontend
    container_name: securemon-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000/api
    depends_on:
      - backend
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: securemon-postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=securemon
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

  zap:
    image: zaproxy/zap-stable:latest
    container_name: securemon-zap
    command: zap.sh -daemon -host 0.0.0.0 -port 8080 -config api.key=securemon-zap-api-token-2026 -config api.addrs.addr.name=.* -config api.addrs.addr.regex=true
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  postgres_data:
